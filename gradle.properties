# Gradle daemon JVM. The build targets Java 8 (`options.release.set(8)`); the daemon runs
# on JDK 21, which can emit --release 8 bytecode and is within Gradle 8.8's supported range.
# Adjust this path to a local JDK 17-21 install if it differs on your machine, or delete it
# and run Gradle on a compatible JDK directly.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/graalvm-21.jdk/Contents/Home
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g
